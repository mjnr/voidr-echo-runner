        ocupacao: analista de logística
    # OCEAN (persona-v2.util.ts): apressado/patience 3/tech alta/monossilabico
    psychometrics:
      openness: 65
      conscientiousness: 55
      extraversion: 30
      agreeableness: 45
      neuroticism: 55
    behaviors:                     # intentNoise=nenhum, disfluency 0.1
      tangential: 0.05
      outOfScopeRequest: 0.05
      incompleteUtterance: 0.05
